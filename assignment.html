<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assignment.css" type="text/css" rel="stylesheet">
    <script src='https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js'></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <title>Period tracking app</title>
</head>
<body>
    <div class="main-container">
        <header class="topbar">
            <div class="top-container">
                <i class="material-symbols-outlined main-icon">menstrual_health</i>
                <span class="main-title">Period Tracker</span>
            </div>
        </header>
        <div class="tracker">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prevMonth">&lt;</button>
                    <span id="month-year"></span>
                    <button id="nextMonth">&gt;</button>
                </div>
                    <div class="calendar-grid" id="calendar">
                </div>
            </div>
            </div>
            <div class="sub-class">
                <div class="circle">
                <span class="text">Period in</span>
                <h2>17 days</h2>
            </div>
                <span class="affirmation">🌸 Dont forget to drink water!</span>
            </div>
        </div>
        
            
            <div class="nav-bar">
            <nav>
                <a href="assignment.html" class="nav">
                    <i class="material-symbols-outlined nav-icon">home</i>
                    <span class="nav_text">Home</span>
                </a>
            </nav>
            <nav>
                <a href="" class="nav">
                    <i class="material-symbols-outlined nav-icon ">overview_key</i>
                    <span class="nav-text">Overview</span>
                </a>
            </nav>
            <nav>
                <a href="" class="nav">
                    <i class="material-symbols-outlined nav-icon track">add</i>
                    <span class="nav-text">Track</span>
                </a>
            </nav>
            <nav>
                <a href="" class="nav">
                    <i class="material-symbols-outlined nav-icon">ink_pen</i>
                    <span class="nav-text">Diary</span>
                </a>
            </nav>
            <nav>
                <a href="settings.html" class="nav">
                    <i class="material-symbols-outlined nav-icon">settings</i>
                    <span class="nav-text">Settings</span>
                </a>
            </nav>
        </div>

        
    </div>
    
</body>
<script src="assignment.js"></script>
</html>
